name: Deploy examples to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site-converter/**'
      - 'src/native/**'
      - 'src/wasm/**'
      - 'tests/fixtures/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/site-converter/package-lock.json
      - name: Install browser build dependencies
        run: npm ci --prefix tools/site-converter
      - name: Verify generated search metadata and static guide
        run: npm run seo:check --prefix tools/site-converter
      - name: Rebuild browser bundle and verify reproducibility
        run: |
          npm run build --prefix tools/site-converter
          git diff --exit-code -- site/vendor
      - name: Test browser conversions and interface
        run: npm test --prefix tools/site-converter
      - name: Check website JavaScript syntax
        run: |
          node --check site/examples.js
          node --check site/app.js
          for file in site/converter*.mjs; do node --check "$file"; done
          npm run docs:check
      - name: Verify Pages publishes this workflow's site artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' > "$RUNNER_TEMP/pages-source"; then
            echo "::error::Cannot read Pages configuration. Enable Pages in Settings > Pages and choose GitHub Actions as Source."
            exit 1
          fi
          if [ "$(cat "$RUNNER_TEMP/pages-source")" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Source to GitHub Actions. Branch/Jekyll publishing serves the repository root and breaks guide.html."
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
