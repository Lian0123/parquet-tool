name: Deploy examples to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site-converter/**'
      - 'src/native/**'
      - 'src/wasm/**'
      - 'tests/fixtures/**'
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'guide.html'
      - 'converter.html'
      - 'en/**'
      - 'ja/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.source.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/site-converter/package-lock.json
      - name: Install browser build dependencies
        run: npm ci --prefix tools/site-converter
      - name: Verify generated search metadata and static guide
        run: |
          npm run seo:check --prefix tools/site-converter
          node tools/site-converter/branch-entrypoints.mjs --check
      - name: Rebuild browser bundle and verify reproducibility
        run: |
          npm run build --prefix tools/site-converter
          git diff --exit-code -- site/vendor
      - name: Test browser conversions and interface
        run: npm test --prefix tools/site-converter
      - name: Check website JavaScript syntax
        run: |
          node --check site/examples.js
          node --check site/app.js
          for file in site/converter*.mjs; do node --check "$file"; done
          npm run docs:check
      - name: Detect Pages publishing mode
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/site-converter/pages-mode.mjs
      - name: Configure Pages
        if: steps.source.outputs.mode == 'workflow'
        uses: actions/configure-pages@v6
      - name: Upload static website
        if: steps.source.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        if: steps.source.outputs.mode == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Rebuild the existing branch Pages site
        if: steps.source.outputs.mode == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > "$RUNNER_TEMP/pages-build.json" 2> "$RUNNER_TEMP/pages-build-error"; then
            cat "$RUNNER_TEMP/pages-build-error"
            echo "::warning::Pages rebuild request was not accepted. The automatic branch build may already be running; live website verification below will determine success."
          fi
      - name: Verify the live website and project WASM engine
        env:
          PAGE_URL: ${{ steps.source.outputs.page_url }}
        run: node tools/site-converter/verify-deployment.mjs "$PAGE_URL"
